# SonarCloud Configuration
sonar.projectKey=muhajirshiddiqaf_Assignment-14Setting-up-CI-CD-with-AI-Tools
sonar.organization=muhajirshiddiqaf

# Source code configuration
sonar.sources=weather-report/source
sonar.tests=weather-report/source

# Language and framework
sonar.language=ts
sonar.typescript.lcov.reportPaths=weather-report/coverage/lcov.info

# Coverage exclusions
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/__tests__/**,**/*.d.ts

# Test coverage
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/__tests__/**
sonar.testExecutionReportPaths=weather-report/coverage/test-report.xml

# Quality Gate Configuration - Strict Settings
# Fail if there are any new bugs, vulnerabilities, or code smells
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Quality Gate Conditions (configured in SonarCloud UI)
# - New Bugs: 0 (fail if any new bugs)
# - New Vulnerabilities: 0 (fail if any new vulnerabilities)
# - New Code Smells: 0 (fail if any new code smells)
# - Coverage on New Code: 80% minimum
# - Duplicated Lines on New Code: 3% maximum

# Security hotspots
sonar.security.hotspots.reviewed=0

# Code duplication
sonar.cpd.ts.minimumTokens=100

# Exclude patterns
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.min.js

# Encoding
sonar.sourceEncoding=UTF-8 
name: CI/CD Pipeline with SonarCloud

on:
  push:
    branches: [ main, develop, Module-7 ]
  pull_request:
    branches: [ main, develop, Module-7 ]

env:
  NODE_VERSION: '18'
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  # Lint Job
  lint:
    name: Lint and Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for SonarCloud
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: weather-report/package-lock.json
        
    - name: Install dependencies
      run: |
        cd weather-report
        npm ci
        
    - name: Install ESLint and TypeScript ESLint
      run: |
        cd weather-report
        npm install --save-dev eslint @typescript-eslint/parser @typescript-eslint/eslint-plugin
        
    - name: Create ESLint configuration
      run: |
        cd weather-report
        cat > .eslintrc.js << 'EOF'
        module.exports = {
          parser: '@typescript-eslint/parser',
          extends: [
            'eslint:recommended',
            '@typescript-eslint/recommended',
          ],
          parserOptions: {
            ecmaVersion: 2020,
            sourceType: 'module',
          },
          env: {
            node: true,
            es6: true,
          },
          rules: {
            '@typescript-eslint/no-unused-vars': 'error',
            '@typescript-eslint/no-explicit-any': 'warn',
            'no-console': 'warn',
            'prefer-const': 'error',
            'no-var': 'error',
          },
        };
        EOF
        
    - name: Run ESLint
      run: |
        cd weather-report
        npx eslint source/ --ext .ts --max-warnings 0
        
    - name: Check TypeScript compilation
      run: |
        cd weather-report
        npx tsc --noEmit

  # Test Job
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: weather-report/package-lock.json
        
    - name: Install dependencies
      run: |
        cd weather-report
        npm ci
        
    - name: Install testing dependencies
      run: |
        cd weather-report
        npm install --save-dev jest @types/jest ts-jest supertest @types/supertest
        
    - name: Create Jest configuration
      run: |
        cd weather-report
        cat > jest.config.js << 'EOF'
        module.exports = {
          preset: 'ts-jest',
          testEnvironment: 'node',
          roots: ['<rootDir>/source'],
          testMatch: ['**/__tests__/**/*.ts', '**/?(*.)+(spec|test).ts'],
          transform: {
            '^.+\\.ts$': 'ts-jest',
          },
          collectCoverageFrom: [
            'source/**/*.ts',
            '!source/**/*.d.ts',
          ],
          coverageDirectory: 'coverage',
          coverageReporters: ['text', 'lcov', 'html'],
        };
        EOF
        
    - name: Create basic test file
      run: |
        cd weather-report
        mkdir -p source/__tests__
        cat > source/__tests__/app.test.ts << 'EOF'
        import request from 'supertest';
        import express from 'express';
        import { weatherRoutes } from '../weatherRoutes';

        const app = express();
        app.use(express.json());
        app.use('/api/weather', weatherRoutes);

        describe('Weather API', () => {
          test('GET /api/weather/health should return 200', async () => {
            const response = await request(app).get('/api/weather/health');
            expect(response.status).toBe(200);
          });

          test('GET /api/weather/cities should return 200', async () => {
            const response = await request(app).get('/api/weather/cities');
            expect(response.status).toBe(200);
          });
        });
        EOF
        
    - name: Run tests
      run: |
        cd weather-report
        npm test -- --coverage --watchAll=false
        
    - name: Upload test coverage
      uses: codecov/codecov-action@v3
      with:
        file: weather-report/coverage/lcov.info
        flags: unittests
        name: codecov-umbrella

  # Build Job
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: weather-report/package-lock.json
        
    - name: Install dependencies
      run: |
        cd weather-report
        npm ci
        
    - name: Build TypeScript
      run: |
        cd weather-report
        npm run build
        
    - name: Verify build output
      run: |
        cd weather-report
        ls -la dist/
        node dist/app.js --version || echo "Build verification completed"
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: weather-report/dist/
        retention-days: 30

  # SonarCloud Analysis
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for SonarCloud
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: weather-report/package-lock.json
        
    - name: Install dependencies
      run: |
        cd weather-report
        npm ci
        
    - name: Run tests with coverage
      run: |
        cd weather-report
        npm test -- --coverage --watchAll=false
        
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=muhajirshiddiqaf_Assignment-14Setting-up-CI-CD-with-AI-Tools
          -Dsonar.organization=muhajirshiddiqaf
          -Dsonar.sources=weather-report/source
          -Dsonar.tests=weather-report/source
          -Dsonar.javascript.lcov.reportPaths=weather-report/coverage/lcov.info
          -Dsonar.testExecutionReportPaths=weather-report/coverage/test-report.xml
          -Dsonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/__tests__/**
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300

  # Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: weather-report/package-lock.json
        
    - name: Install dependencies
      run: |
        cd weather-report
        npm ci
        
    - name: Run npm audit
      run: |
        cd weather-report
        npm audit --audit-level=high
        
    - name: Run Snyk security scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high
        working-directory: weather-report

  # Deploy Job (Optional - for demonstration)
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [sonarcloud, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Module-7'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: weather-report/package-lock.json
        
    - name: Install dependencies
      run: |
        cd weather-report
        npm ci
        
    - name: Build application
      run: |
        cd weather-report
        npm run build
        
    - name: Deploy to staging environment
      run: |
        echo "Deploying to staging environment..."
        echo "Build completed successfully!"
        echo "Application is ready for deployment"
        
    - name: Notify deployment success
      run: |
        echo "✅ Deployment to staging completed successfully!"
        echo "🔗 Application URL: https://staging-weather-app.example.com"
        echo "📊 SonarCloud Quality Gate: PASSED"
        echo "🔒 Security Scan: PASSED" 